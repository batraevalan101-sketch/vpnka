<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Прототип клиента: десктоп</title>
<style>
:root{--bg:#f1f2f6;--surf:#fff;--surf2:#eceef5;--tx:#16181f;--mut:#7b8190;--acc:#6f63f2;--acc2:#e9e7ff;--line:#e3e5ee;--ok:#1aa57a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12131a;--surf:#1b1d27;--surf2:#262936;--tx:#eceef6;--mut:#8f95a6;--acc:#8b81ff;--acc2:#2a2850;--line:#2b2e3c;--ok:#34d3a1}}
:root[data-theme="dark"]{--bg:#12131a;--surf:#1b1d27;--surf2:#262936;--tx:#eceef6;--mut:#8f95a6;--acc:#8b81ff;--acc2:#2a2850;--line:#2b2e3c;--ok:#34d3a1}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-size:14px}
button{font:inherit;color:inherit}
.win{display:grid;grid-template-columns:64px minmax(0,560px) 1fr;height:100%}
.rail{background:var(--surf);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px}
.rail button{width:40px;height:40px;border:0;background:none;border-radius:10px;color:var(--tx);cursor:pointer;display:grid;place-items:center;position:relative}
.rail button svg{width:20px;height:20px}
.rail button.on{background:var(--surf2)}
.rail button.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--acc)}
.rail .sp{flex:1}
.mid{overflow-y:auto;padding:20px 18px;border-right:1px solid var(--line)}
.screen{display:none}.screen.on{display:block}
h1{font-size:22px;margin:0 0 14px;font-weight:650}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.search{flex:1;height:38px;border:1px solid var(--line);background:var(--surf);border-radius:8px;padding:0 12px;color:var(--tx);font:inherit}
.search:focus-visible,.btn:focus-visible,.rail button:focus-visible,.srv:focus-visible,.ghead:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ibtn{width:34px;height:34px;border:0;background:none;border-radius:8px;color:var(--mut);cursor:pointer;display:grid;place-items:center}
.ibtn:hover{background:var(--surf2)}
.ibtn svg{width:18px;height:18px}
.group{background:var(--surf);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
.ghead{display:flex;align-items:center;gap:8px;padding:12px 12px 8px;width:100%;background:none;border:0;text-align:left;cursor:pointer}
.chev{transition:transform .2s;color:var(--mut)}
.group.closed .chev{transform:rotate(-90deg)}
.group.closed .gbody{display:none}
.gt b{font-size:15px;display:block}.gt small{color:var(--mut);font-size:11.5px}
.gt{flex:1;min-width:0}
.usage{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--acc2);font-size:11.5px}
.track{flex:1;height:14px;border-radius:7px;background:var(--surf);border:1px solid var(--line);position:relative;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;background:var(--acc);opacity:.35}
.track span{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px}
.note{padding:8px 12px;text-align:center;font-size:11.5px;color:var(--mut);background:var(--acc2)}
.srv{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;background:none;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer;position:relative}
.srv:hover{background:var(--surf2)}
.srv.sel{background:var(--acc2)}
.srv.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc)}
.dot{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:8.5px;font-weight:700;color:#fff}
.srv b{display:block;font-weight:500;font-size:14.5px}.srv small{color:var(--mut);font-size:11px}
.srv .grow{flex:1;min-width:0}
.pg{font-size:12px;color:var(--ok);font-variant-numeric:tabular-nums}
.right{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:20px 24px 28px;background:radial-gradient(120% 70% at 50% 25%,var(--surf) 0,var(--bg) 70%)}
.top{width:100%;display:flex;justify-content:flex-end}
select{height:34px;min-width:150px;border:0;border-radius:6px;background:var(--surf);color:var(--tx);padding:0 10px;font:inherit}
.ring{width:220px;height:220px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}
.ring2{width:180px;height:180px;border-radius:50%;background:var(--surf2);display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line)}
.power{width:128px;height:128px;border-radius:50%;border:0;background:var(--surf);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 6px 18px rgba(0,0,0,.12);color:var(--mut);transition:box-shadow .3s}
.power svg{width:34px;height:34px}
.power.on{color:var(--acc);box-shadow:0 0 0 4px var(--acc2),0 6px 24px rgba(111,99,242,.35)}
.power.busy{color:var(--acc);animation:p 1.1s ease-in-out infinite}
@keyframes p{50%{box-shadow:0 0 0 10px var(--acc2)}}
@media (prefers-reduced-motion:reduce){.power.busy{animation:none}}
.power small{font-size:10.5px;letter-spacing:.04em}
.power em{font-style:normal;font-size:12px;color:var(--tx);font-variant-numeric:tabular-nums}
.cur{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:300px}
.cur .dot{width:32px;height:32px;font-size:10px}
.btn{width:100%;height:36px;border:0;border-radius:6px;background:var(--acc);color:#fff;cursor:pointer;font-weight:500}
.row{display:flex;justify-content:space-between;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:10px}
.row small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.sw{position:relative;width:42px;height:24px;border-radius:12px;background:var(--surf2);border:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--mut);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--acc2)}
.sw[aria-checked="true"]::after{transform:translateX(18px);background:var(--acc)}
.empty{color:var(--mut);padding:30px 0;text-align:center}
@media (max-width:860px){
 .win{grid-template-columns:56px 1fr;grid-template-rows:auto 1fr}
 .rail{grid-row:1 / 3}
 .right{grid-column:2;grid-row:1;flex-direction:row;flex-wrap:wrap;gap:14px;padding:14px}
 .ring{width:120px;height:120px}.ring2{width:100px;height:100px}.power{width:76px;height:76px}.power svg{width:22px;height:22px}.power small{display:none}
 .top{width:auto;order:3}.cur{flex:1;align-items:flex-start;min-width:160px}
 .mid{grid-column:2;grid-row:2;border-right:0}
}
</style>
</head>
<body>
<div class="win">
 <nav class="rail" aria-label="Разделы">
  <button data-go="servers" class="on" title="Серверы" aria-label="Серверы"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></button>
  <button data-go="add" title="Добавить подписку" aria-label="Добавить подписку"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg></button>
  <button data-go="settings" title="Настройки" aria-label="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 7h9M18 7h1M5 17h2M11 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
  <button data-go="stats" title="Статистика" aria-label="Статистика"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18l5-6 4 3 7-9"/></svg></button>
  <span class="sp"></span>
  <button id="theme" title="Тема" aria-label="Сменить тему">◐</button>
 </nav>

 <main class="mid">
  <section class="screen on" id="servers">
   <h1>Серверы</h1>
   <div class="bar">
    <input class="search" id="q" placeholder="Введите текст для поиска" aria-label="Поиск серверов">
    <button class="ibtn" id="pingAll" title="Проверить пинг" aria-label="Проверить пинг"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/></svg></button>
   </div>
   <div id="groups"></div>
  </section>
  <section class="screen" id="add"><h1>Добавить подписку</h1>
   <div class="bar"><input class="search" placeholder="Вставьте ссылку на подписку" aria-label="Ссылка на подписку"></div>
   <button class="btn" style="max-width:220px">Добавить</button></section>
  <section class="screen" id="settings"><h1>Настройки</h1>
   <div class="row"><div>Автоподключение<small>При запуске приложения</small></div><button class="sw" role="switch" aria-checked="false" aria-label="Автоподключение"></button></div>
   <div class="row"><div>Автовыбор сервера<small>По наименьшему пингу</small></div><button class="sw" role="switch" aria-checked="true" aria-label="Автовыбор сервера"></button></div>
   <div class="row"><div>Автообновление подписок<small>Раз в час</small></div><button class="sw" role="switch" aria-checked="true" aria-label="Автообновление подписок"></button></div>
  </section>
  <section class="screen" id="stats"><h1>Статистика</h1><p class="empty">Здесь появятся график трафика и история подключений.</p></section>
 </main>

 <aside class="right">
  <div class="top"><select aria-label="Режим"><option>Смешанный</option><option>Только прокси</option><option>Только VPN</option></select></div>
  <div class="ring"><div class="ring2">
   <button class="power" id="power" aria-label="Подключиться">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
    <small id="st">ОТКЛЮЧЁН</small><em id="tm">00:00:00</em>
   </button></div></div>
  <div class="cur">
   <span class="dot" id="cd"></span>
   <span id="cn"></span>
   <button class="btn" id="pingBtn">Тест пинга</button>
  </div>
 </aside>
</div>
<script>
var cols=["#4f7cf0","#d6455d","#e08a1e","#2fa36b","#8a5cf0","#2a2f3d"];
var subs=[
 {n:"Подписка А",d:"Автообновление, 1 ч",used:24,max:999,note:"Если VPN не работает, обновите подписку",s:[
  ["EU","Быстрый","VLESS / WS / TLS / JSON"],["LV","Быстрый","VLESS / WS / TLS / JSON"],["LV","Hysteria","HYSTERIA / TLS / JSON"],
  ["DE","Быстрый","VLESS / WS / TLS / JSON"],["DE","Hysteria","HYSTERIA / TLS / JSON"],["NL","Быстрый","HYSTERIA / TLS / JSON"],
  ["VN","LTE обход 1","VLESS / GRPC / REALITY / JSON"],["VN","LTE обход 2","VLESS / TCP / REALITY / JSON"],["RU","Мосты → NL","VLESS / TCP / REALITY / JSON"]]},
 {n:"Подписка Б",d:"Автообновление, 1 ч",used:0,max:0,note:"",s:[
  ["FI","Основной","VLESS / GRPC / REALITY / JSON"],["SE","Резервный","VLESS / TCP / REALITY / JSON"]]}
];
var sel=[0,0],state="off",t0=0,tick=null,pings={};
function $(i){return document.getElementById(i)}
function dot(c){var i=0;for(var k=0;k<c.length;k++)i+=c.charCodeAt(k);return '<span class="dot" style="background:'+cols[i%cols.length]+'">'+c+'</span>'}
function render(){
  var q=$("q").value.toLowerCase(),h="";
  subs.forEach(function(g,gi){
    var rows="";
    g.s.forEach(function(s,si){
      if(q&&(s[1]+s[2]+s[0]).toLowerCase().indexOf(q)<0)return;
      var p=pings[gi+"-"+si];
      rows+='<button class="srv'+(sel[0]===gi&&sel[1]===si?" sel":"")+'" data-g="'+gi+'" data-s="'+si+'">'+dot(s[0])+'<span class="grow"><b>'+s[1]+'</b><small>'+s[2]+'</small></span>'+(p?'<span class="pg">'+p+' мс</span>':"")+'</button>';
    });
    var use=g.max?'<div class="usage"><span aria-hidden="true">ⓘ</span><div class="track"><i style="width:'+(g.used/g.max*100)+'%"></i><span>'+g.used+' ГБ / '+g.max+' ГБ</span></div></div>':'<div class="usage"><span aria-hidden="true">ⓘ</span><div class="track"><span>Безлимит</span></div></div>';
    h+='<div class="group" data-gi="'+gi+'"><button class="ghead"><span class="chev">⌄</span><span class="gt"><b>'+g.n+'</b><small>'+g.d+'</small></span></button>'+use+(g.note?'<div class="note">'+g.note+'</div>':"")+'<div class="gbody">'+rows+'</div></div>';
  });
  $("groups").innerHTML=h;
  var c=subs[sel[0]].s[sel[1]];
  $("cd").outerHTML=dot(c[0]).replace('class="dot"','class="dot" id="cd"');
  $("cn").textContent=c[0]+" | "+c[1];
}
$("groups").addEventListener("click",function(e){
  var s=e.target.closest(".srv"),h=e.target.closest(".ghead");
  if(s){sel=[+s.dataset.g,+s.dataset.s];render()}
  else if(h){h.parentNode.classList.toggle("closed")}
});
$("q").addEventListener("input",render);
function pingAll(){subs.forEach(function(g,gi){g.s.forEach(function(_,si){pings[gi+"-"+si]=20+Math.floor(Math.random()*140)})});render()}
$("pingAll").addEventListener("click",pingAll);$("pingBtn").addEventListener("click",pingAll);
document.querySelectorAll(".rail [data-go]").forEach(function(b){b.addEventListener("click",function(){
  document.querySelectorAll(".screen").forEach(function(s){s.classList.toggle("on",s.id===b.dataset.go)});
  document.querySelectorAll(".rail [data-go]").forEach(function(x){x.classList.toggle("on",x===b)});
})});
function f(n){return String(n).padStart(2,"0")}
function set(s){state=s;$("power").className="power"+(s==="on"?" on":s==="busy"?" busy":"");
  $("st").textContent=s==="on"?"ПОДКЛЮЧЁН":s==="busy"?"ПОДКЛЮЧЕНИЕ":"ОТКЛЮЧЁН";
  $("power").setAttribute("aria-label",s==="on"?"Отключиться":"Подключиться")}
$("power").addEventListener("click",function(){
  if(state==="busy")return;
  if(state==="on"){clearInterval(tick);set("off");$("tm").textContent="00:00:00";return}
  set("busy");setTimeout(function(){set("on");t0=Date.now();tick=setInterval(function(){
    var d=Math.floor((Date.now()-t0)/1000);$("tm").textContent=f(Math.floor(d/3600))+":"+f(Math.floor(d%3600/60))+":"+f(d%60)},1000)},1100);
});
document.querySelectorAll(".sw").forEach(function(b){b.addEventListener("click",function(){b.setAttribute("aria-checked",b.getAttribute("aria-checked")!=="true")})});
$("theme").addEventListener("click",function(){var r=document.documentElement;r.setAttribute("data-theme",r.getAttribute("data-theme")==="dark"?"light":"dark")});
render();
</script>
</body>
</html>
